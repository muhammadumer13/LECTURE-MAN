<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Student Lectures</title><link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
<div class="student-shell" style="margin-top:25px">
<div class="student-hero"><span class="pill">COURSE MATERIAL</span><h1 id="title">My Course Lectures</h1><p>Download published lecture material and assignments.</p></div>
<div id="content"><div class="student-week"><p class="muted">Loading course material...</p></div></div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://vujdddbwrsrhbonvzhxk.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_i7Mgxy5g7wj5hRBexwymIA_uVlKaBZR";
const supabase_client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const FILE_BUCKET="course-files";
const esc=s=>String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const fileUrl=path=>path?supabase_client.storage.from(FILE_BUCKET).getPublicUrl(path).data.publicUrl:"";
async function loadStudent(){
 try{
  const [{data:lectures,error:le},{data:assignments,error:ae}]=await Promise.all([
   supabase_client.from("lectures").select("*").eq("published",true).order("week",{ascending:true}).order("created_at",{ascending:true}),
   supabase_client.from("assignments").select("*").eq("published",true).order("no",{ascending:true})
  ]);
  if(le)throw le;if(ae)throw ae;
  let out="";
  for(let w=1;w<=15;w++){let a=lectures.filter(x=>x.week===w);if(!a.length)continue;out+=`<div class="student-week"><h3>Week ${String(w).padStart(2,"0")}</h3>`+a.map(x=>`<div class="student-item"><div><b>${esc(x.title)}</b><div class="meta">${esc(x.description||"Lecture material")}</div></div>${x.file_path?`<a class="download" href="${fileUrl(x.file_path)}" target="_blank" rel="noopener">Download ↓</a>`:`<span class="meta">No file</span>`}</div>`).join("")+"</div>"}
  if(assignments.length)out+=`<div class="student-week"><h3>Assignments</h3>`+assignments.map(x=>`<div class="assignment-row"><b>Assignment ${x.no}: ${esc(x.title)}</b><div class="meta">${esc(x.description||"")}${x.due?" · Due "+esc(x.due):""}</div>${x.file_path?`<a class="download" href="${fileUrl(x.file_path)}" target="_blank" rel="noopener">Download ↓</a>`:""}</div>`).join("")+"</div>";
  content.innerHTML=out||'<div class="student-week"><p class="muted">No published material is available yet.</p></div>';
 }catch(err){console.error(err);content.innerHTML=`<div class="student-week"><p class="muted">Unable to load course material. Please try again later.</p></div>`}
}
loadStudent();
</script>
</body></html>
